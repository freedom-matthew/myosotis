              <label for="mz-text" style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: #4A4945">Text<span style="font: 400 12px 'Geist Mono', monospace; color: #66645F">612 words</span></label>

Context is the strongest cue: the same place, the same time of day and the same preceding action trigger the routine automatically. In diary studies, Wendy Wood and colleagues found that roughly 43% of daily actions were repeated in the same context, usually while people were thinking about something else.

Implementation intentions — “when X happens, I will do Y” — help a new habit start by borrowing an existing cue…</textarea>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const mode = s.mode || 'paste';
    const depth = s.depth || 'balanced';
    const on = 'background: #FFFFFF; color: #1D1E22; box-shadow: 0 1px 2px rgba(29,30,34,0.08)';
    const off = 'background: transparent; color: #4A4945';
    const modes = [['paste', 'Paste text'], ['file', 'Open file']].map(([id, label]) => ({
      label, on: mode === id, style: mode === id ? on : off, pick: () => this.setState({ mode: id })
    }));
    const dOn = 'border: 1px solid #3E6FB0; background: #EEF3FA; color: #1D1E22; box-shadow: 0 0 0 1px #3E6FB0 inset';
    const dOff = 'border: 1px solid #E6E2D9; background: #FBFAF7; color: #1D1E22';
    const depths = [
      ['essentials', 'Essentials', 'Only the core ideas · ~6 cards'],
      ['balanced', 'Balanced', 'Key ideas and supporting facts · ~14 cards'],
      ['thorough', 'Thorough', 'Every testable detail · ~30 cards']
    ].map(([id, label, hint]) => ({
      label, hint, on: depth === id, style: depth === id ? dOn : dOff, pick: () => this.setState({ depth: id })
    }));
    return { modes, depths, isPaste: mode === 'paste', isFile: mode === 'file' };
  }
}
</script>
