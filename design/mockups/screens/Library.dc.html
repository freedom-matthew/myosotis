<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>myosotis — Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#3E6FB0}a:hover{color:#2C5590}
.mz-nav{transition:background-color 120ms ease}
.mz-nav:hover{background:#E9E5DC}
.mz-tr{transition:background-color 120ms ease;cursor:pointer}
.mz-tr:hover{background:#F3F0EA}
.mz-chip{transition:background-color 120ms ease, border-color 120ms ease;cursor:pointer}
.mz-chip:hover{border-color:#CBC5B9}
.mz-field:focus{outline:none;border-color:#3E6FB0;box-shadow:0 0 0 3px rgba(62,111,176,0.16)}
@keyframes mz-in{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
.mz-panel{animation:mz-in 220ms cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.mz-panel{animation:none}}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F6F4EF; color: #1D1E22; font-family: Geist, system-ui, sans-serif">
  <nav aria-label="Main" style="flex: 1 1 216px; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; background: #F0EDE6; border-right: 1px solid #E6E2D9">
    <div style="padding: 0 10px"><span style="font-family: Newsreader, Georgia, serif; font-style: italic; font-size: 24px; line-height: 1; letter-spacing: -0.005em">myosotis</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="Import.dc.html" style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 10px; background: #1D1E22; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500">
        <span style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New source</span>
        <span style="font: 12px 'Geist Mono', monospace; color: #C9CBD1">⌘N</span>
      </a>
      <button type="button" style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 10px; border: 1px solid #E0DBD1; background: #F8F6F1; color: #4A4945; font: 14px Geist, system-ui, sans-serif; cursor: pointer">
        <span style="display: flex; align-items: center; gap: 8px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search</span>
        <span style="font: 12px 'Geist Mono', monospace; color: #66645F">⌘K</span>
      </button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <a class="mz-nav" href="Today.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: #4A4945; text-decoration: none; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Today</a>
      <a class="mz-nav" href="Curate.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: #4A4945; text-decoration: none; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg><span style="flex: 1">Inbox</span><span style="font: 500 12px 'Geist Mono', monospace; padding: 1px 8px; border-radius: 999px; background: #DCE6F4; color: #2C5590">12</span></a>
      <a class="mz-nav" href="Library.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; background: #E5E1D8; color: #1D1E22; text-decoration: none; font-size: 14px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>Library</a>
    </div>
    <div style="flex: 1"></div>
    <a class="mz-nav" href="Settings.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: #4A4945; text-decoration: none; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>Settings</a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 40px 28px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 30px; font-weight: 400; letter-spacing: -0.01em">Library</h1>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="font-size: 14px; color: #66645F"><span style="font-family: 'Geist Mono', monospace">1,284</span> cards</span>
        <a href="Tidy.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid #DDD8CE; border-radius: 10px; background: #FFFFFF; color: #1D1E22; text-decoration: none; font: 500 14px Geist, system-ui, sans-serif">Tidy up<span style="font: 500 12px 'Geist Mono', monospace; padding: 2px 8px; border-radius: 999px; background: #DCE6F4; color: #2C5590">4</span></a>
      </div>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
      <div style="flex: 1 1 320px; position: relative; display: flex; align-items: center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#66645F" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 13px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <label for="mz-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search cards</label>
        <input id="mz-q" class="mz-field" type="search" placeholder="Search questions, answers and origins" style="box-sizing: border-box; width: 100%; padding: 10px 40px 10px 36px; border: 1px solid #DDD8CE; border-radius: 10px; background: #FFFFFF; color: #1D1E22; font: 14px Geist, system-ui, sans-serif">
        <span style="position: absolute; right: 12px; font: 12px 'Geist Mono', monospace; color: #66645F">/</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button type="button" class="mz-chip" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="padding: 8px 12px; border-radius: 999px; font: 500 12px Geist, system-ui, sans-serif; {{f.style}}">{{f.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <div style="flex: 999 1 480px; min-width: 0; overflow-x: auto; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6E2D9">
        <table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px">
          <thead>
            <tr style="text-align: left; color: #66645F; font-size: 12px">
              <th scope="col" style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid #EEEBE4">Question</th>
              <th scope="col" style="padding: 12px 12px; font-weight: 500; border-bottom: 1px solid #EEEBE4">From</th>
              <th scope="col" style="padding: 12px 12px; font-weight: 500; border-bottom: 1px solid #EEEBE4; width: 110px">Recall now</th>
              <th scope="col" style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid #EEEBE4; width: 70px; text-align: right">Next</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
              <tr class="mz-tr" onClick="{{r.pick}}" style="vertical-align: middle; {{r.rowStyle}}">
                <td style="padding: 12px 16px; border-bottom: 1px solid #F1EEE8; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.q}}</td>
                <td style="padding: 12px; border-bottom: 1px solid #F1EEE8; color: #66645F; white-space: nowrap">{{r.src}}</td>
                <td style="padding: 12px; border-bottom: 1px solid #F1EEE8">
                  <div style="display: flex; align-items: center; gap: 8px">
                    <div style="width: 48px; height: 4px; border-radius: 6px; background: #EEEBE4"><div style="height: 4px; border-radius: 6px; background: #3E6FB0; width: {{r.recall}}"></div></div>
                    <span style="font: 12px 'Geist Mono', monospace; color: #4A4945">{{r.recall}}</span>
                  </div>
                </td>
                <td style="padding: 12px 16px; border-bottom: 1px solid #F1EEE8; text-align: right; font: 12px 'Geist Mono', monospace; color: #4A4945">{{r.next}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>

      <aside class="mz-panel" aria-label="Card details" style="flex: 1 1 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6E2D9">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="mz-eq" style="font-size: 12px; font-weight: 500; color: #4A4945">Question</label>
          <textarea id="mz-eq" class="mz-field" rows="3" style="box-sizing: border-box; width: 100%; resize: vertical; padding: 10px 12px; border: 1px solid #DDD8CE; border-radius: 10px; background: #FBFAF7; color: #1D1E22; font: 16px/1.4 Newsreader, Georgia, serif" value="{{sel.q}}"></textarea>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="mz-ea" style="font-size: 12px; font-weight: 500; color: #4A4945">Answer</label>
          <textarea id="mz-ea" class="mz-field" rows="4" style="box-sizing: border-box; width: 100%; resize: vertical; padding: 10px 12px; border: 1px solid #DDD8CE; border-radius: 10px; background: #FBFAF7; color: #1D1E22; font: 16px/1.5 Newsreader, Georgia, serif" value="{{sel.a}}"></textarea>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 500; color: #4A4945">Context</span>
          <p style="margin: 0; padding: 10px 12px; border-radius: 10px; background: #FBFAF7; border: 1px solid #EEEBE4; font: 14px/1.5 Newsreader, Georgia, serif; color: #34353A">{{sel.ex}}</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 10px; background: #F6F4EF; font-size: 12px; color: #4A4945">
          <div style="display: flex; justify-content: space-between; gap: 12px"><span>From</span><span style="text-align: right">{{sel.from}}</span></div>
          <div style="display: flex; justify-content: space-between"><span>Reviews</span><span style="font-family: 'Geist Mono', monospace">{{sel.reviews}}</span></div>
          <div style="display: flex; justify-content: space-between"><span>Next review</span><span style="font-family: 'Geist Mono', monospace">{{sel.next}}</span></div>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" style="flex: 1; padding: 8px 12px; border: 1px solid #DDD8CE; border-radius: 10px; background: #FFFFFF; color: #1D1E22; font: 500 14px Geist, system-ui, sans-serif; cursor: pointer">Suspend</button>
          <button type="button" style="flex: 1; padding: 8px 12px; border: 1px solid #DDD8CE; border-radius: 10px; background: #FFFFFF; color: #1D1E22; font: 500 14px Geist, system-ui, sans-serif; cursor: pointer">Delete</button>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const cards = [
      { q: 'What do the folds of the inner mitochondrial membrane (cristae) do?', a: 'They increase the membrane surface area, making room for more electron-transport chains and ATP synthase, so the cell can produce more ATP.', src: 'Cell biology — ch. 3', recall: 62, next: 'today', reviews: 4, ex: '…the inner membrane is folded into cristae, which greatly increase the surface available for the electron transport chain and ATP synthase.', also: '' },
      { q: 'Why does spaced practice beat cramming for long-term retention?', a: 'Retrieving a memory after some forgetting strengthens it more than retrieving it while it is still fresh.', src: 'The Spacing Effect', recall: 88, next: '3d', reviews: 6, ex: 'Retrieval that happens after some forgetting produces a larger gain than retrieval of material that is still easily accessible.', also: ' + Make It Stick — notes' },
      { q: 'When and where did the Velvet Revolution begin?', a: 'On 17 November 1989 in Prague, when riot police suppressed a student march on Národní třída.', src: 'Czech history', recall: 95, next: '12d', reviews: 7, ex: 'On 17 November 1989, riot police broke up a peaceful student march on Národní třída in Prague.', also: '' },
      { q: 'Where in the mitochondrion is ATP synthase located?', a: 'In the inner mitochondrial membrane.', src: 'Cell biology — ch. 3', recall: 79, next: '2d', reviews: 3, ex: 'ATP synthase is embedded in the inner mitochondrial membrane, where the proton gradient drives it.', also: '' },
      { q: 'What three parts make up the habit loop?', a: 'Cue, routine and reward.', src: 'Psychology of Habit', recall: 100, next: 'new', reviews: 0, ex: 'Habits form through a loop of cue, routine and reward.', also: '' },
      { q: 'What is the testing effect?', a: 'Practising retrieval improves long-term retention more than re-reading the same material.', src: 'The Spacing Effect', recall: 91, next: '6d', reviews: 5, ex: 'Practising retrieval improves long-term retention more than re-reading the same material.', also: '' },
      { q: 'Who became president of Czechoslovakia in December 1989?', a: 'Václav Havel.', src: 'Czech history', recall: 97, next: '24d', reviews: 8, ex: 'On 29 December 1989 the Federal Assembly elected Václav Havel president.', also: '' },
      { q: 'What molecule carries electrons from glycolysis into the mitochondrion?', a: 'NADH (its electrons are passed in via shuttle systems).', src: 'Cell biology — ch. 3', recall: 54, next: 'today', reviews: 5, ex: 'NADH produced in glycolysis cannot cross the inner membrane; its electrons enter through shuttle systems.', also: '' }
    ];
    const s = this.state || {};
    const sel = s.sel !== undefined ? s.sel : 0;
    const filter = s.filter || 'All';
    const rows = cards.map((c, i) => ({
      q: c.q, src: c.src, recall: (c.next === 'new' ? 100 : c.recall) + '%', next: c.next,
      rowStyle: i === sel ? 'background: #EEF3FA; box-shadow: inset 3px 0 0 #3E6FB0' : '',
      pick: () => this.setState({ sel: i })
    }));
    const on = 'border: 1px solid #1D1E22; background: #1D1E22; color: #FFFFFF';
    const off = 'border: 1px solid #DDD8CE; background: #FFFFFF; color: #1D1E22';
    const filters = ['All', 'Due today', 'New', 'Low recall', 'Suspended'].map((label) => ({
      label, on: filter === label, style: filter === label ? on : off, pick: () => this.setState({ filter: label })
    }));
    const c = cards[sel];
    return { rows, filters, sel: { q: c.q, a: c.a, from: c.src + c.also, ex: c.ex, next: c.next, reviews: String(c.reviews) } };
  }
}
</script>
</body>
