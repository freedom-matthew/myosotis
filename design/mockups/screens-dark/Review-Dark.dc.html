<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>myosotis — Review (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#8FB3EE}a:hover{color:#B5CCF4}
@keyframes mz-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mz-reveal{animation:mz-in 260ms cubic-bezier(.2,.7,.2,1) both}
.mz-grades{animation:mz-in 220ms 40ms cubic-bezier(.2,.7,.2,1) both}
.mz-btn{transition:background-color 120ms ease, border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;cursor:pointer}
.mz-btn:hover{border-color:#4A5060;background:#1A1D24}
.mz-btn:active{transform:translateY(1px)}
.mz-primary:hover{background:#A6C3F2;border-color:#A6C3F2}
.mz-ghost{transition:background-color 120ms ease, color 120ms ease;cursor:pointer}
.mz-ghost:hover{background:#262A33;color:#E7E9EE}
.mz-ghost:disabled{opacity:0.4;cursor:default;background:transparent}
@media (prefers-reduced-motion: reduce){.mz-reveal,.mz-grades{animation:none}}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #121419; color: #E7E9EE; font-family: Geist, system-ui, sans-serif">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px">
    <a class="mz-ghost" href="Today-Dark.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; color: #B7BCC7; text-decoration: none; font-size: 14px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>End session<span style="font: 12px 'Geist Mono', monospace; color: #9AA0AD">Esc</span>
    </a>
    <div style="flex: 1; max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 8px">
      <span style="font: 12px 'Geist Mono', monospace; color: #9AA0AD">{{counter}}</span>
      <div style="width: 100%; height: 3px; border-radius: 999px; background: #2A2E37; overflow: hidden">
        <div style="height: 3px; border-radius: 999px; background: #8FB3EE; transition: width 400ms cubic-bezier(.2,.7,.2,1); width: {{progressW}}"></div>
      </div>
    </div>
    <button type="button" class="mz-ghost" onClick="{{undo}}" disabled="{{cantUndo}}" style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: #B7BCC7; font: 14px Geist, system-ui, sans-serif">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>Undo<span style="font: 12px 'Geist Mono', monospace; color: #9AA0AD">Z</span>
    </button>
  </header>

  <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 24px">
      <article style="width: 100%; max-width: 680px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 44px 48px; border-radius: 20px; background: #1A1D24; border: 1px solid #2A2E37; box-shadow: 0 1px 2px rgba(0,0,0,0.25), 0 18px 48px rgba(0,0,0,0.35)">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9AA0AD">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>{{card.src}}
        </span>
        <h1 style="margin: 0; font-family: {{cardFont}}; font-size: 30px; font-weight: 400; line-height: 1.25; letter-spacing: -0.005em; text-wrap: pretty">{{card.q}}</h1>
        <sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
          <div class="mz-reveal" style="display: flex; flex-direction: column; gap: 20px">
            <div style="height: 1px; background: #262A33"></div>
            <p style="margin: 0; font-family: {{cardFont}}; font-size: 20px; line-height: 1.5; color: #C4C8D2; text-wrap: pretty">{{card.a}}</p>
            <sc-if value="{{explain}}" hint-placeholder-val="{{ false }}">
              <div class="mz-reveal" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 10px; background: #20242C">
                <span style="font-size: 12px; font-weight: 500; color: #9AA0AD">Explanation</span>
                <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #C4C8D2">{{card.ex}}</p>
              </div>
            </sc-if>
            <sc-if value="{{ctx}}" hint-placeholder-val="{{ false }}">
              <div class="mz-reveal" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 10px; background: #1E2129; border: 1px solid #262A33">
                <span style="font-size: 12px; font-weight: 500; color: #9AA0AD">From {{card.src}}</span>
                <p style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 16px; line-height: 1.55; color: #C4C8D2">{{card.cx}}</p>
              </div>
            </sc-if>
            <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-left: -10px">
              <button type="button" class="mz-ghost" onClick="{{toggleExplain}}" style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 0; border-radius: 8px; background: transparent; color: #B7BCC7; font: 12px Geist, system-ui, sans-serif">Explain<span style="font: 12px 'Geist Mono', monospace; color: #9AA0AD">X</span></button>
              <a class="mz-ghost" href="Library.dc.html" style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; color: #B7BCC7; text-decoration: none; font-size: 12px">Edit card<span style="font: 12px 'Geist Mono', monospace; color: #9AA0AD">E</span></a>
              <button type="button" class="mz-ghost" onClick="{{toggleCtx}}" style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 0; border-radius: 8px; background: transparent; color: #B7BCC7; font: 12px Geist, system-ui, sans-serif">Show context<span style="font: 12px 'Geist Mono', monospace; color: #9AA0AD">C</span></button>
            </div>
          </div>
        </sc-if>
      </article>
    </main>

    <footer style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 8px 24px 32px; min-height: 92px; box-sizing: border-box">
      <sc-if value="{{notRevealed}}" hint-placeholder-val="{{ true }}">
        <button type="button" class="mz-btn" onClick="{{reveal}}" style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; max-width: 360px; padding: 16px 20px; border: 1px solid #343945; border-radius: 14px; background: #1E2129; color: #E7E9EE; font: 500 16px Geist, system-ui, sans-serif">Show answer<span style="font: 12px 'Geist Mono', monospace; padding: 2px 6px; border-radius: 6px; border: 1px solid #343945; color: #9AA0AD">Space</span></button>
      </sc-if>
      <sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
        <div class="mz-grades" style="width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{grades}}" as="g" hint-placeholder-count="4">
            <sc-if value="{{g.plain}}" hint-placeholder-val="{{ true }}">
              <button type="button" class="mz-btn" onClick="{{g.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 10px; border: 1px solid #343945; border-radius: 14px; background: #1E2129; color: #E7E9EE; font: 500 14px Geist, system-ui, sans-serif">{{g.label}}<span style="font: 12px 'Geist Mono', monospace; color: #9AA0AD">{{g.key}} · {{g.ivl}}</span></button>
            </sc-if>
            <sc-if value="{{g.primary}}" hint-placeholder-val="{{ false }}">
              <button type="button" class="mz-btn mz-primary" onClick="{{g.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0 10px; border: 1px solid #8FB3EE; border-radius: 14px; background: #8FB3EE; color: #10131A; font: 500 14px Geist, system-ui, sans-serif; box-shadow: 0 6px 16px rgba(143,179,238,0.16)">{{g.label}}<span style="font: 12px 'Geist Mono', monospace; color: #10131A">{{g.key}} · {{g.ivl}}</span></button>
            </sc-if>
          </sc-for>
        </div>
      </sc-if>
    </footer>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <main class="mz-reveal" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center">
      <h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 30px; font-weight: 400">That is everything for now.</h1>
      <p style="margin: 0; font-size: 16px; color: #9AA0AD">Next reviews tomorrow: 24 cards, about 6 minutes.</p>
      <div style="display: flex; gap: 10px; margin-top: 8px">
        <a href="Today-Dark.dc.html" style="padding: 12px 20px; border-radius: 14px; background: #E7E9EE; color: #10131A; text-decoration: none; font-size: 14px; font-weight: 500">Back to Today</a>
        <button type="button" class="mz-btn" onClick="{{restart}}" style="padding: 12px 20px; border: 1px solid #343945; border-radius: 14px; background: #1E2129; color: #E7E9EE; font: 500 14px Geist, system-ui, sans-serif">Replay demo</button>
      </div>
    </main>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startRevealed":{"editor":"boolean","default":true},"cardFont":{"editor":"enum","options":["Serif","Sans"],"default":"Serif"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const cards = [
      { src: 'The Spacing Effect · article', q: 'Why does spaced practice beat cramming for long-term retention?', a: 'Retrieving a memory after some forgetting strengthens it more than retrieving it while it is still fresh. Cramming feels fluent, but the fluency fades within days.', ex: 'Think of each review as a workout: lifting a weight that is slightly too heavy builds more strength than lifting one you can barely feel. Waiting until a memory is a little hard to reach makes the retrieval effortful, and effortful retrieval is what tells the brain to keep it.', cx: '…learning is more effective when sessions are spread out. Retrieval that happens after some forgetting produces a larger gain than retrieval of material that is still easily accessible.', ivl: ['<1m', '8m', '3d', '9d'] },
      { src: 'Cell biology — chapter 3', q: 'What do the folds of the inner mitochondrial membrane (cristae) do?', a: 'They increase the membrane surface area, making room for more electron-transport chains and ATP synthase, so the cell can produce more ATP.', ex: 'ATP is made by proteins that sit in the inner membrane. More folds means more membrane in the same volume, so more of those proteins fit, like adding shelves to a cupboard.', cx: 'The inner membrane is folded into cristae, which greatly increase the surface available for the electron transport chain and ATP synthase.', ivl: ['<1m', '6m', '1d', '4d'] },
      { src: 'Czech history — notes', q: 'When and where did the Velvet Revolution begin?', a: 'On 17 November 1989 in Prague, when riot police suppressed a student march on Národní třída.', ex: 'The march commemorated the 50th anniversary of the 1939 student protests against the Nazi occupation. Outrage at the police response led to strikes and mass demonstrations within days.', cx: 'On 17 November 1989, riot police broke up a peaceful student march on Národní třída in Prague, commemorating the events of 1939.', ivl: ['<1m', '10m', '12d', '31d'] },
      { src: 'The Psychology of Habit — notes', q: 'Why do habits persist even after the reward stops mattering?', a: 'With repetition, control shifts from goal-directed circuits to the dorsolateral striatum, so the cue triggers the routine on its own.', ex: 'Early on you act because you want the outcome. After many repetitions the context itself starts the behaviour, so removing the reward does not switch it off.', cx: 'Over many repetitions, control of the behaviour shifts from goal-directed circuits to the dorsolateral striatum, which is why a habit can persist even when its reward is no longer wanted.', ivl: ['<1m', '6m', '1d', '3d'] }
    ];
    const s = this.state || {};
    const idx = s.idx || 0;
    const done = idx >= cards.length;
    const revealed = s.revealed !== undefined ? s.revealed : !!this.props.startRevealed;
    const explain = !!s.explain;
    const ctx = !!s.ctx;
    const card = cards[Math.min(idx, cards.length - 1)];
    const serif = (this.props.cardFont ?? 'Serif') === 'Serif';
    const next = () => this.setState({ idx: idx + 1, revealed: false, explain: false, ctx: false });
    const grades = ['Again', 'Hard', 'Good', 'Easy'].map((label, i) => ({
      label, key: String(i + 1), ivl: card.ivl[i], primary: i === 2, plain: i !== 2, pick: next
    }));
    return {
      card, grades, done, notDone: !done, revealed, notRevealed: !revealed, explain, ctx,
      cardFont: serif ? 'Newsreader, Georgia, serif' : 'Geist, system-ui, sans-serif',
      counter: Math.min(idx + 1, cards.length) + ' of ' + cards.length,
      progressW: Math.round((idx / cards.length) * 100) + '%',
      cantUndo: idx === 0,
      reveal: () => this.setState({ revealed: true }),
      toggleExplain: () => this.setState({ explain: !explain, revealed: true }),
      toggleCtx: () => this.setState({ ctx: !ctx, revealed: true }),
      undo: () => this.setState({ idx: Math.max(0, idx - 1), revealed: false, explain: false, ctx: false }),
      restart: () => this.setState({ idx: 0, revealed: false, explain: false, ctx: false })
    };
  }
}
</script>
</body>
</html>
