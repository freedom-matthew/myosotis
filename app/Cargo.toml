[package]
name = "myosotis-app"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
myosotis-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tauri = { version = "2", features = [] }
tokio = { version = "1.54.1", features = ["process", "io-util", "time"] }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
